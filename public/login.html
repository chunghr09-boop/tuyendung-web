<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Khoản Tuyển Dụng - Đông Dương</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background:#f0f2f5; display:flex; justify-content:center; align-items:center; min-height:100vh;">

  <div class="auth-card" style="background:#fff; padding:32px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.08); width:100%; max-width:420px;">
    
    <!-- Tab chuyển đổi Đăng Nhập / Đăng Ký -->
    <div style="display:flex; border-bottom:2px solid #f3f4f6; margin-bottom:20px;">
      <button id="tab-login-btn" onclick="toggleAuth('login')" style="flex:1; padding:10px; border:none; background:none; font-weight:bold; color:#0b57d0; border-bottom:2px solid #0b57d0; cursor:pointer;">Đăng Nhập</button>
      <button id="tab-register-btn" onclick="toggleAuth('register')" style="flex:1; padding:10px; border:none; background:none; font-weight:bold; color:#6b7280; border-bottom:2px solid transparent; cursor:pointer;">Đăng Ký Tài Khoản</button>
    </div>

    <!-- FORM ĐĂNG NHẬP -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div style="margin-bottom:14px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Tên đăng nhập</label>
        <input type="text" id="l-username" required placeholder="admin hoặc tên tài khoản" style="width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Mật khẩu</label>
        <input type="password" id="l-password" required placeholder="Nhập mật khẩu" style="width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <button type="submit" class="btn-search" style="width:100%; padding:11px; font-size:14px;">Đăng Nhập</button>
    </form>

    <!-- FORM ĐĂNG KÝ (ỨNG VIÊN) -->
    <form id="register-form" onsubmit="handleRegister(event)" style="display:none;">
      <div style="margin-bottom:12px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Họ và Tên *</label>
        <input type="text" id="r-fullname" required placeholder="VD: Nguyễn Văn A" style="width:100%; padding:9px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Email cá nhân *</label>
        <input type="email" id="r-email" required placeholder="VD: ungvien@gmail.com" style="width:100%; padding:9px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Tên đăng nhập *</label>
        <input type="text" id="r-username" required placeholder="Viết liền không dấu" style="width:100%; padding:9px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <div style="margin-bottom:18px;">
        <label style="font-size:13px; font-weight:600; color:#374151;">Mật khẩu *</label>
        <input type="password" id="r-password" required placeholder="Tối thiểu 6 ký tự" style="width:100%; padding:9px; border:1px solid #d1d5db; border-radius:6px; margin-top:4px;">
      </div>
      <button type="submit" class="btn-search" style="width:100%; padding:11px; font-size:14px; background:#10b981;">Tạo Tài Khoản Mới</button>
    </form>

    <div id="auth-msg" style="margin-top:15px; font-size:13px; text-align:center;"></div>
    
    <div style="margin-top:20px; text-align:center;">
      <a href="/" style="color:#6b7280; font-size:13px; text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Về trang chủ tìm việc</a>
    </div>
  </div>

  <script>
    function toggleAuth(mode) {
      const isLogin = mode === 'login';
      document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
      document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
      document.getElementById('tab-login-btn').style.color = isLogin ? '#0b57d0' : '#6b7280';
      document.getElementById('tab-login-btn').style.borderBottomColor = isLogin ? '#0b57d0' : 'transparent';
      document.getElementById('tab-register-btn').style.color = !isLogin ? '#10b981' : '#6b7280';
      document.getElementById('tab-register-btn').style.borderBottomColor = !isLogin ? '#10b981' : 'transparent';
      document.getElementById('auth-msg').innerHTML = '';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const msg = document.getElementById('auth-msg');
      msg.innerHTML = '<span style="color:#6b7280;">Đang xác thực...</span>';

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('l-username').value,
          password: document.getElementById('l-password').value
        })
      });
      const data = await res.json();

      if (data.success) {
        msg.innerHTML = '<span style="color:#10b981;">Đăng nhập thành công!</span>';
        if (data.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }
      } else {
        msg.innerHTML = `<span style="color:#dc2626;">${data.message}</span>`;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const msg = document.getElementById('auth-msg');
      msg.innerHTML = '<span style="color:#6b7280;">Đang đăng ký...</span>';

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullname: document.getElementById('r-fullname').value,
          email: document.getElementById('r-email').value,
          username: document.getElementById('r-username').value,
          password: document.getElementById('r-password').value
        })
      });
      const data = await res.json();

      if (data.success) {
        msg.innerHTML = `<span style="color:#10b981;">${data.message} Bạn có thể chuyển sang Đăng nhập.</span>`;
        document.getElementById('register-form').reset();
        setTimeout(() => toggleAuth('login'), 1500);
      } else {
        msg.innerHTML = `<span style="color:#dc2626;">${data.message}</span>`;
      }
    }
  </script>
</body>
</html>
